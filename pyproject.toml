[project]
name = "gtm-agent"
version = "0.1.0"
description = "GTM Agent — X/Twitter component"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
