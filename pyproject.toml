[project]
name = "gtm-agent"
version = "0.1.0"
description = "GTM Agent — X/Twitter component"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
# Only for gtm_agent/research_authors.py (paper-outreach run 1.5); the rest of
# the pipeline never needs it.
research = ["claude-agent-sdk>=0.1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gtm_agent*"]
