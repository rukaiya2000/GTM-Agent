<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 132" width="520" height="132" role="img" aria-label="Wingman">
  <title>Wingman</title>

  <defs>
    <linearGradient id="lead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Mark: two speech bubbles flying in formation. The dashed one sits off the
       lead's shoulder, out ahead and prepared. The solid one, carrying the
       approval check, is what you actually send. -->
  <g transform="translate(24, 20)">
    <!-- wing: offset up and right, deliberately clear of the lead so both read -->
    <rect x="44" y="0" width="60" height="42" rx="11"
          fill="none" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="6 5" opacity="0.6"/>

    <!-- lead: front and low, with the tail -->
    <path d="M12 30 H68 a12 12 0 0 1 12 12 V70 a12 12 0 0 1 -12 12 H36 L20 94 V82 H12 a12 12 0 0 1 -12 -12 V42 a12 12 0 0 1 12 -12 Z"
          fill="url(#lead)"/>

    <!-- approval check, centred in the lead bubble -->
    <path d="M28 55 l9 9 l17 -19" fill="none" stroke="#FFFFFF" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark colours are fixed rather than currentColor: GitHub renders README
       images inside <img>, where an SVG cannot inherit the page text colour.
       Both values hold contrast on white and on #0d1117. -->
  <text x="156" y="66"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700" letter-spacing="-1.2" fill="#6366F1">Wingman</text>
  <text x="158" y="94"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500" letter-spacing="0.3" fill="#8B93A7">Finds the room. You do the talking.</text>
</svg>
