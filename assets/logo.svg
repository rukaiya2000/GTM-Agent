<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" role="img" aria-label="Wingman">
  <title>Wingman</title>

  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Mark: two speech bubbles flying in formation, like a wingman off the lead's
       shoulder. The dashed one is the draft that goes out ahead; the solid one
       carrying the check is what you approved and sent. -->
  <g transform="translate(20, 26)">
    <!-- the wingman: out ahead, prepared, never sent on its own -->
    <path d="M26 10 H94 a12 12 0 0 1 12 12 V64 a12 12 0 0 1 -12 12 H58 L40 92 V76 H26 a12 12 0 0 1 -12 -12 V22 a12 12 0 0 1 12 -12 Z"
          fill="none" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="6 5" opacity="0.55"/>
    <!-- the lead: what you actually publish -->
    <path d="M8 0 H76 a12 12 0 0 1 12 12 V54 a12 12 0 0 1 -12 12 H40 L22 82 V66 H8 a12 12 0 0 1 -12 -12 V12 a12 12 0 0 1 12 -12 Z"
          fill="url(#front)"/>
    <!-- approval check inside the published bubble -->
    <path d="M26 33 l10 10 l20 -20" fill="none" stroke="#FFFFFF" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark colours are fixed rather than currentColor: GitHub renders README
       images inside <img>, where an SVG cannot inherit the page text colour.
       Both values are chosen to hold contrast on white and on #0d1117. -->
  <text x="150" y="80"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="-1.2" fill="#6366F1">Wingman</text>
  <text x="152" y="110"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="500" letter-spacing="0.5" fill="#8B93A7">Finds the room. Opens the conversation. You do the talking.</text>
</svg>
